[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Зависимости живут в requirements.txt / requirements-dev.txt, здесь только
# описание пакета и настройки инструментов.
[project]
name = "edtable"
version = "0.1.0"
description = "Составление расписания занятий"
readme = "README.md"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
